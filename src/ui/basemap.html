<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#eff5f6;background:#27363d}
svg{display:block;width:100%;height:485px;touch-action:none;cursor:grab}
path{cursor:pointer;stroke:#182324;stroke-width:.6;fill-opacity:.66}path:focus,path:hover{stroke:white;stroke-width:2}
aside,nav,output,footer{position:absolute;background:#17262bf2;padding:6px 10px;border-radius:5px}
aside{bottom:30px;left:8px}nav{top:8px;left:8px}output{top:8px;right:8px;white-space:pre-line}
button{font:inherit;cursor:pointer}footer{bottom:2px;right:4px;font-size:11px}a{color:inherit}
</style>
<svg aria-label="Study area grid"></svg><nav><button aria-label="Zoom in">+</button> <button aria-label="Zoom out">−</button> <button>Fit area</button></nav>
<aside></aside><output hidden><button aria-label="Close details">×</button> <span></span></output><footer><a target="_blank" rel="noopener noreferrer"></a></footer>
<script>
const data=JSON.parse(atob("__DATA__")), svg=document.querySelector("svg"), popup=document.querySelector("output");
const colors=["#440154","#3b528b","#21918c","#5ec962","#fde725"];
const clamp=(v,l,h)=>Math.min(h,Math.max(l,v));
function project([lon,lat]){
  const a=clamp(lat,-85.05112878,85.05112878)*Math.PI/180;
  return [(lon+180)/360,(1-Math.asinh(Math.tan(a))/Math.PI)/2];
}
let left=Infinity,right=-Infinity,topY=Infinity,bottom=-Infinity,anchor;
for(const row of data.rows){
  const g=row.geometry;
  row.rings=(g.type==="Polygon"?[g.coordinates]:g.coordinates).flat().map(ring=>ring.map(point=>{
    let [x,y]=project(point); anchor??=x; x+=Math.round(anchor-x);
    left=Math.min(left,x);right=Math.max(right,x);topY=Math.min(topY,y);bottom=Math.max(bottom,y);
    return [x,y];
  }));
}
const valid=data.rows.map(r=>r.values[0]).filter(v=>v!==null);
const lo=Math.min(...valid),hi=Math.max(...valid);
const fmt=v=>v===null?"No data":Number(v.toPrecision(4)).toString();
function color(v){
  if(v===null)return "#889197";
  if(data.priority)return v?colors[4]:colors[1];
  return colors[hi===lo?2:Math.min(4,Math.floor(5*(v-lo)/(hi-lo)))];
}
const legend=document.querySelector("aside");
legend.textContent=data.unit+" ";
const stops=data.priority?[0,1]:!valid.length?[]:hi===lo?[lo]:colors.map((_,i)=>lo+i*(hi-lo)/5);
for(const [i,v] of stops.entries()){
  const chip=document.createElement("span");chip.style.color=data.priority||hi===lo?color(v):colors[i];
  chip.textContent=" ■";legend.append(chip,data.priority?(v?" Priority":" Other"):fmt(v));
}
if(!valid.length)legend.append("No data");
else if(!data.priority&&hi!==lo)legend.append(" – "+fmt(hi));
const credit=document.querySelector("footer a");
credit.href=data.satellite?"https://www.esri.com/en-us/arcgis/products/arcgis-living-atlas":"https://www.openstreetmap.org/copyright";
credit.textContent=data.satellite?"Imagery © Esri and imagery providers":"© OpenStreetMap contributors";
let cx,cy,z;
function element(tag,attrs,parent){
  const el=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);
  parent.append(el);return el;
}
function draw(){
  const w=svg.clientWidth,h=svg.clientHeight,n=2**z,size=n*256;
  const ox=cx*size-w/2,oy=cy*size-h/2;svg.replaceChildren();
  for(let x=Math.floor(ox/256);x<=Math.floor((ox+w)/256);x++){
    for(let y=Math.max(0,Math.floor(oy/256));y<=Math.min(n-1,Math.floor((oy+h)/256));y++){
      const tx=((x%n)+n)%n;
      const href=data.satellite?`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${tx}`:`https://tile.openstreetmap.org/${z}/${tx}/${y}.png`;
      element("image",{href,x:x*256-ox,y:y*256-oy,width:256,height:256},svg);
    }
  }
  for(const row of data.rows){
    const d=row.rings.map(r=>r.map(([x,y],i)=>(i?"L":"M")+(x*size-ox).toFixed(1)+" "+(y*size-oy).toFixed(1)).join("")+"Z").join("");
    const path=element("path",{d,fill:color(row.values[0]),"fill-rule":"evenodd",tabindex:0,"aria-label":"Cell "+row.id},svg);
    const show=()=>{
      const labels=[data.unit,"Surface temperature (°C)","NO₂ (mol/m²)","Greenness (NDVI)","Exposure score"];
      popup.querySelector("span").textContent="Cell "+row.id+"\n"+row.values.map((v,i)=>labels[i]+"  "+fmt(v)).join("\n");popup.hidden=false;
    };
    path.onclick=show;path.onkeydown=e=>{if(e.key==="Enter")show()};
  }
}
function fit(){
  if(!svg.clientWidth||!data.rows.length)return;
  cx=(left+right)/2;cy=(topY+bottom)/2;
  z=clamp(Math.floor(Math.log2(Math.min(svg.clientWidth/(right-left),svg.clientHeight/(bottom-topY))*.90/256)),0,18);draw();
}
const buttons=document.querySelectorAll("nav button");
buttons[0].onclick=()=>{z=Math.min(18,z+1);draw()};buttons[1].onclick=()=>{z=Math.max(0,z-1);draw()};buttons[2].onclick=fit;
popup.querySelector("button").onclick=()=>popup.hidden=true;
let start;
svg.onpointerdown=e=>{start=[e.clientX,e.clientY]};
svg.onpointerup=e=>{
  if(!start)return;
  const dx=e.clientX-start[0],dy=e.clientY-start[1];start=null;
  if(Math.hypot(dx,dy)>5){cx-=dx/(256*2**z);cy=clamp(cy-dy/(256*2**z),0,1);draw()}
};
new ResizeObserver(fit).observe(svg);
</script>
